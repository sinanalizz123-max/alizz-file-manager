name: Android Build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish to rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --title "Development build" --notes "Rolling debug APK from main." --prerelease
          fi
          gh release upload dev "$APK" --clobber
